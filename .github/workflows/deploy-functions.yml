# Deploys the Supabase Edge Functions (supabase/functions/*) without needing a
# terminal. Runs when function code changes on main, or by hand from the
# Actions tab (Deploy Supabase functions -> Run workflow).
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (a personal access token
# from supabase.com -> Account -> Access Tokens). This is NOT the service_role
# key; the functions get that from Supabase itself.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: owlralulybcvgaaahjbs
    steps:
      - name: Check the access token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions). See SUPABASE_SETUP.md."
          exit 1
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy submit-run, delete-account and chat
        run: |
          for fn in submit-run delete-account chat; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
